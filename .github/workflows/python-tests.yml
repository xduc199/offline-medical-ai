name: Python tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-and-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit and local API tests
        run: python -m unittest discover -s tests -p "test*.py" -v
      - name: Evaluate keyword retrieval baseline
        run: python -m tests.evaluate_retrieval --method keyword --top-k 5
